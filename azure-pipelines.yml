trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: testSuite
    displayName: 'Test Suite'
    type: string
    default: 'web:login'
    values:
      - test
      - web
      - api
      - web:login
      - api:login
      - web:smoke
      - api:smoke

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: ENABLE_TESTRAIL
    value: 'false'
  - name: HEADLESS
    value: 'true'

stages:
  - stage: Test
    displayName: 'Run Playwright Tests'
    jobs:
      - job: PlaywrightLogin
        displayName: 'Login Module Tests'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'

          - script: cp .env.example .env
            displayName: 'Setup environment file'

          - script: npm run $(testSuite)
            displayName: 'Execute tests'
            env:
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              VALID_USER_EMAIL: $(VALID_USER_EMAIL)
              VALID_USER_PASSWORD: $(VALID_USER_PASSWORD)

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: 'reports'
              artifact: 'automation-reports'
            displayName: 'Publish reports'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'test-results'
            displayName: 'Publish test results'
